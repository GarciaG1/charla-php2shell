; Mitigación temporal de PHP2Shell (CVE-2026-109619 / CVE-2026-115560).
; NO sustituye al parche: para CVE-2026-109618 solo sirve actualizar PHP.
;
; Va en php.ini o en un .ini del pool de PHP-FPM, NUNCA con ini_set() ni .user.ini.
; Después hay que reiniciar los workers (o recrear el contenedor).

session.upload_progress.enabled = 0

